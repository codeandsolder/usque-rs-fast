name: Cargo quarantine retry

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: cargo-quarantine-retry
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find open lockfile maintenance PR
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          owner=${GH_REPO%%/*}
          pr_json=$(
            gh api --method GET "repos/${GH_REPO}/pulls" \
              -f state=open \
              -f "head=${owner}:renovate/lock-file-maintenance" \
              -f per_page=1
          )

          number=$(jq -r '.[0].number // empty' <<<"${pr_json}")
          if [[ -z "${number}" ]]; then
            echo "found=false" >>"${GITHUB_OUTPUT}"
            echo "No open lockfile-maintenance PR."
            exit 0
          fi

          echo "found=true" >>"${GITHUB_OUTPUT}"
          echo "number=${number}" >>"${GITHUB_OUTPUT}"
          echo "head_sha=$(jq -r '.[0].head.sha' <<<"${pr_json}")" >>"${GITHUB_OUTPUT}"
          echo "base_sha=$(jq -r '.[0].base.sha' <<<"${pr_json}")" >>"${GITHUB_OUTPUT}"

      - name: Check out the frozen snapshot
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Probe release-age eligibility without changing the branch
        if: steps.pr.outputs.found == 'true'
        id: probe
        shell: bash
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "${BASE_SHA}"
          git show "${BASE_SHA}:.github/scripts/cargo-release-quarantine.py" \
            >"${RUNNER_TEMP}/cargo-release-quarantine.py"

          set +e
          python3 "${RUNNER_TEMP}/cargo-release-quarantine.py" \
            --base-ref "${BASE_SHA}" \
            --hours 72
          status=$?
          set -e

          if (( status == 0 )); then
            echo "eligible=true" >>"${GITHUB_OUTPUT}"
            echo "The frozen Cargo.lock snapshot has cleared quarantine."
          else
            echo "eligible=false" >>"${GITHUB_OUTPUT}"
            echo "The frozen snapshot is still quarantined; leaving it untouched."
          fi

      - name: Finalize the cleared snapshot
        if: steps.pr.outputs.found == 'true' && steps.probe.outputs.eligible == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          pr_json=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")
          current_head=$(jq -r '.head.sha' <<<"${pr_json}")
          if [[ "${current_head}" != "${HEAD_SHA}" ]]; then
            echo "PR head moved during the probe; next scheduled run will evaluate the new snapshot."
            exit 0
          fi

          mergeable=$(jq -r '.mergeable // "unknown"' <<<"${pr_json}")
          if [[ "${mergeable}" == "false" ]]; then
            if ! gh api "repos/${GH_REPO}/labels/rebase" >/dev/null 2>&1; then
              gh api --method POST "repos/${GH_REPO}/labels" \
                -f name=rebase \
                -f color=d4c5f9 \
                -f description='Request Renovate regeneration after quarantine clears' \
                >/dev/null
            fi

            jq -nc '{labels:["rebase"]}' |
              gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
                --input - >/dev/null
            echo "Snapshot is old enough but conflicts with main; requested one Renovate regeneration."
            exit 0
          fi

          if [[ "${mergeable}" != "true" ]]; then
            echo "GitHub has not computed mergeability yet; retrying on the next schedule."
            exit 0
          fi

          get_run() {
            local workflow=$1
            gh api --method GET \
              "repos/${GH_REPO}/actions/workflows/${workflow}/runs" \
              -f event=pull_request \
              -f branch=renovate/lock-file-maintenance \
              -f per_page=20 \
              --jq ".workflow_runs[] | select(.head_sha == \"${HEAD_SHA}\") | [.id, .status, (.conclusion // \"\"), .run_attempt] | @tsv" |
              head -n 1
          }

          quarantine_run=$(get_run dependency-quarantine.yml)
          if [[ -z "${quarantine_run}" ]]; then
            echo "No quarantine run exists for the current head; refusing to merge."
            exit 0
          fi

          IFS=$'\t' read -r quarantine_id quarantine_status quarantine_conclusion quarantine_attempt <<<"${quarantine_run}"
          if [[ "${quarantine_status}" != "completed" ]]; then
            echo "Quarantine check is still ${quarantine_status}; leaving the PR untouched."
            exit 0
          fi

          if [[ "${quarantine_conclusion}" == "failure" ]]; then
            gh api --method POST \
              "repos/${GH_REPO}/actions/runs/${quarantine_id}/rerun-failed-jobs" \
              >/dev/null
            echo "Re-running the existing quarantine check for the unchanged snapshot."

            for _ in {1..30}; do
              sleep 10
              run_json=$(gh api "repos/${GH_REPO}/actions/runs/${quarantine_id}")
              attempt=$(jq -r '.run_attempt' <<<"${run_json}")
              status=$(jq -r '.status' <<<"${run_json}")
              conclusion=$(jq -r '.conclusion // ""' <<<"${run_json}")
              if (( attempt > quarantine_attempt )) && [[ "${status}" == "completed" ]]; then
                quarantine_status=${status}
                quarantine_conclusion=${conclusion}
                break
              fi
            done
          fi

          if [[ "${quarantine_status}" != "completed" || "${quarantine_conclusion}" != "success" ]]; then
            echo "Quarantine has not produced a successful result for the frozen head yet; refusing to merge."
            exit 0
          fi

          for workflow in ci.yml rust-skills2-strict.yml; do
            run=$(get_run "${workflow}")
            if [[ -z "${run}" ]]; then
              echo "No ${workflow} pull-request run exists for the current head; refusing to merge."
              exit 0
            fi

            IFS=$'\t' read -r _ status conclusion _ <<<"${run}"
            if [[ "${status}" != "completed" || "${conclusion}" != "success" ]]; then
              echo "${workflow} is ${status}/${conclusion}; refusing to merge."
              exit 0
            fi
          done

          pr_json=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")
          current_head=$(jq -r '.head.sha' <<<"${pr_json}")
          if [[ "${current_head}" != "${HEAD_SHA}" ]]; then
            echo "PR head moved after validation; refusing to merge."
            exit 0
          fi

          merge_json=$(
            gh api --method PUT "repos/${GH_REPO}/pulls/${PR_NUMBER}/merge" \
              -f "sha=${HEAD_SHA}" \
              -f merge_method=squash
          )
          if [[ "$(jq -r '.merged' <<<"${merge_json}")" != "true" ]]; then
            echo "GitHub did not merge the PR: $(jq -r '.message // "unknown reason"' <<<"${merge_json}")"
            exit 0
          fi

          echo "Merged the cleared frozen snapshot without regenerating Cargo.lock."

          # GITHUB_TOKEN-authored merges do not recursively trigger push workflows.
          # Explicit dispatch preserves the repository's normal post-merge validation.
          gh workflow run ci.yml --repo "${GH_REPO}" --ref main
          gh workflow run rust-skills2-strict.yml --repo "${GH_REPO}" --ref main
