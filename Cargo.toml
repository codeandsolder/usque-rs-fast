[package]
name = "usque-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust MASQUE client for Cloudflare WARP with native TUN and direct-L4 proxy modes (unofficial)"
license = "MIT"

[[bin]]
name = "usque-rs"
path = "src/main.rs"

[features]
default = ["tun", "http-proxy", "https-proxy", "socks5-proxy", "register"]
tun = ["dep:env_logger", "tokio/io-util", "tokio/net", "tokio/sync", "tokio/time", "dep:quiche", "dep:socket2", "dep:nix", "dep:thiserror", "dep:datagram-socket", "dep:futures", "dep:octets", "dep:rtnetlink", "dep:tun-rs"]
http-proxy = ["dep:env_logger", "tokio/io-util", "tokio/net", "tokio/sync", "tokio/time", "dep:quiche", "dep:socket2", "dep:hickory-proto", "dep:bytes", "dep:http-body-util", "dep:hyper", "hyper/client", "hyper/http1", "hyper/server", "dep:hyper-util"]
https-proxy = ["dep:env_logger", "tokio/io-util", "tokio/net", "tokio/sync", "tokio/time", "dep:quiche", "dep:socket2", "dep:hickory-proto", "dep:bytes", "dep:http-body-util", "dep:hyper", "hyper/client", "hyper/http1", "hyper/server", "dep:hyper-util", "dep:rustls", "dep:tokio-rustls"]
socks5-proxy = ["dep:env_logger", "tokio/io-util", "tokio/net", "tokio/sync", "tokio/time", "dep:quiche", "dep:socket2", "dep:hickory-proto", "dep:fast-socks5"]
register = ["dep:env_logger", "dep:reqwest", "dep:rustls", "dep:webpki-roots"]

[dependencies]
quiche = { version = "0.30.0", optional = true }
octets = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

tokio = { version = "1", features = ["macros", "rt"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
base64 = "0.23"
log = "0.4"
env_logger = { version = "0.11", optional = true }
anyhow = "1"
thiserror = { version = "2", optional = true }
rcgen = "0.14"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }
tun-rs = { version = "2.8.8", features = ["async"], optional = true }
rtnetlink = { version = "0.23", optional = true }
futures = { version = "0.3", optional = true }
tempfile = "3"
time = "0.3"
socket2 = { version = "0.6", optional = true }
nix = { version = "0.31.3", features = ["net", "socket", "time", "uio"], optional = true }
datagram-socket = { version = "0.8.0", optional = true }
fast-socks5 = { version = "1", optional = true }
hyper = { version = "1", default-features = false, optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
hickory-proto = { version = "0.26.3", optional = true }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = "1.15"

[patch.crates-io]
quiche = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "75520b4f9da689d5e7a6d03660c759c4a61ed4e0" }
octets = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "75520b4f9da689d5e7a6d03660c759c4a61ed4e0" }
tun-rs = { git = "https://github.com/codeandsolder/tun-rs-fast.git", rev = "302d6bc98f491e9ca3a6113919cbc6f9c23c7b3f" }
datagram-socket = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "75520b4f9da689d5e7a6d03660c759c4a61ed4e0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
