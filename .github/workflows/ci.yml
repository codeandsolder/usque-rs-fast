name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation path to exercise manually
        type: choice
        required: true
        default: routine
        options: [routine, cross-cache]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  current-linux:
    name: Native nightly Linux validation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation != 'cross-cache' }}
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
    with:
      runner: ubuntu-26.04
      rust-components: "rustfmt clippy"
      rustflags: "-C target-cpu=x86-64-v2"
      command: |
        set -euo pipefail
        # Preserve all existing source, format, Clippy, test and feature checks.
        if git grep -n -E '(^|[^[:alnum:]_])allow[[:space:]]*\(' -- '*.rs'; then
          echo 'allow(...) attributes are forbidden in Rust sources; use a narrow reasoned expect(...)' >&2
          exit 1
        fi
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends cmake ninja-build golang-go perl pkg-config clang libclang-dev nasm
        cargo test --all-features
        # Run genuine loopback SOCKS/HTTP/TLS wire tests even when features
        # are compiled independently. No registration or external network.
        for features in socks5-proxy http-proxy https-proxy http-proxy,https-proxy; do
          cargo test --locked --lib --no-default-features \
            --features "$features" proxy::integration_tests
        done
        cargo check --all-targets
        cargo check --all-targets --no-default-features
        for features in register tun http-proxy https-proxy socks5-proxy http-proxy,https-proxy,socks5-proxy; do
          cargo check --all-targets --no-default-features --features "$features"
        done

  cross-cache-smoke:
    # Explicit dispatch only: no additional routine PR runners. Build a
    # deployable full-proxy static artifact via the existing release bridge
    # while verifying mandatory cross-container sccache connectivity.
    name: Cross-container sccache smoke (x86_64 musl)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation == 'cross-cache' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CROSS_CONFIG: Cross.toml
      CARGO_PROFILE_RELEASE_PANIC: abort
      USQUE_BUILD_FEATURES: http-proxy,https-proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve native quarantined Rust
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "${{ steps.compiler.outputs.channel }}"
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
        with:
          rust-toolchain: "${{ steps.compiler.outputs.channel }}"
          rustflags: "cross:x86_64-unknown-linux-musl:baseline"
      - name: Install cross
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cross
      - name: Build representative release target and check cache activity
        shell: bash
        run: |
          set -euo pipefail
          compile_requests() {
            "$SCCACHE_BIN" --show-stats --stats-format json |
              jq -er '.stats.compile_requests | select(type == "number" and . >= 0 and floor == .)'
          }
          before="$(compile_requests)"
          bash .github/scripts/cross-build-with-sccache.sh x86_64-unknown-linux-musl
          test -f target/x86_64-unknown-linux-musl/release/usque-rs
          after="$(compile_requests)"
          printf 'Cross-container sccache compile requests: %s -> %s\n' "$before" "$after"
          if (( after <= before )); then
            echo "No compiler traffic reached the host sccache daemon during the build" >&2
            exit 1
          fi
      - name: Prepare verified deployable artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-artifact
          install -m 0755 target/x86_64-unknown-linux-musl/release/usque-rs deployment-artifact/usque-rs
          printf '%s\n' "$GITHUB_SHA" > deployment-artifact/SOURCE_COMMIT
          printf '%s\n' "socks5-proxy,http-proxy,https-proxy" > deployment-artifact/BUILD_FEATURES
          (cd deployment-artifact && sha256sum usque-rs > SHA256SUMS)
          cat deployment-artifact/SOURCE_COMMIT deployment-artifact/BUILD_FEATURES deployment-artifact/SHA256SUMS
      - name: Upload manual release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usque-rs-x86_64-musl-proxies-${{ github.sha }}
          path: deployment-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main

  x86-codegen:
    name: x86 codegen / ${{ matrix.cpu }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        cpu: [x86-64-v2, x86-64-v3, znver1, znver2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go perl \
            pkg-config clang libclang-dev nasm

      - name: Resolve native quarantined Rust
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "${{ steps.compiler.outputs.channel }}"

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
        with:
          rust-toolchain: "${{ steps.compiler.outputs.channel }}"
          rustflags: "-C target-cpu=${{ matrix.cpu }}"

      - name: Check target CPU build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        run: cargo check --all-targets --all-features --target x86_64-unknown-linux-gnu
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
