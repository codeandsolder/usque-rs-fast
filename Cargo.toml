[package]
name = "usque-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "Rust MASQUE client for Cloudflare WARP with native TUN and direct-L4 proxy modes (unofficial)"
license = "MIT"

[[bin]]
name = "usque-rs"
path = "src/main.rs"

[features]
default = ["socks5-proxy"]
tun = ["register", "dep:env_logger", "tokio/io-util", "tokio/net", "tokio/sync", "tokio/time", "dep:quiche", "dep:socket2", "dep:nix", "dep:thiserror", "dep:datagram-socket", "dep:octets", "dep:tun-rs", "dep:boring", "dep:log"]
http-proxy = ["register", "dep:env_logger", "tokio/io-util", "tokio/net", "tokio/sync", "tokio/time", "dep:quiche", "dep:socket2", "dep:bytes", "dep:http-body-util", "dep:hyper", "hyper/client", "hyper/http1", "hyper/server", "dep:hyper-util", "dep:boring", "dep:log"]
https-proxy = ["register", "dep:env_logger", "tokio/io-util", "tokio/net", "tokio/sync", "tokio/time", "dep:quiche", "dep:socket2", "dep:bytes", "dep:http-body-util", "dep:hyper", "hyper/client", "hyper/http1", "hyper/server", "dep:hyper-util", "dep:tokio-boring", "dep:boring", "dep:log"]
socks5-proxy = ["register", "dep:env_logger", "tokio/io-util", "tokio/net", "tokio/sync", "tokio/time", "dep:quiche", "dep:socket2", "dep:fast-socks5", "dep:boring", "dep:log"]
register = ["dep:time", "tokio/io-util", "tokio/net", "dep:bytes", "dep:http-body-util", "dep:hyper", "hyper/client", "hyper/http1", "dep:hyper-util", "dep:tokio-boring", "dep:boring", "dep:log"]

[dependencies]
quiche = { version = "0.30.0", optional = true }
octets = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

tokio = { version = "1", features = ["macros", "rt"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
boring = { version = "5.2", optional = true }
tokio-boring = { version = "5.2", optional = true }
base64 = "0.23"
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", default-features = false, optional = true }
anyhow = "1"
thiserror = { version = "2", optional = true }
tun-rs = { version = "2.8.8", default-features = false, features = ["async"], optional = true }
time = { version = "0.3", optional = true }
socket2 = { version = "0.6", optional = true }
nix = { version = "0.31.3", features = ["net", "socket", "time", "uio"], optional = true }
datagram-socket = { version = "0.8.0", optional = true }
fast-socks5 = { git = "https://github.com/codeandsolder/fast-socks5-fast", rev = "d2068a90af77dc672f017c236376c26ed8f297ba", optional = true }
hyper = { version = "1", default-features = false, optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"


[patch.crates-io]
quiche = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "9ddf883381349d95fe845316fc4177d0f8cf42d4" }
octets = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "9ddf883381349d95fe845316fc4177d0f8cf42d4" }
tun-rs = { git = "https://github.com/codeandsolder/tun-rs-fast.git", rev = "6731de0221a0c59856249d3b0a577f78b60c1ecc" }
datagram-socket = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "9ddf883381349d95fe845316fc4177d0f8cf42d4" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
