[package]
name = "usque-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Tiny Rust MASQUE (CONNECT-IP) client for Cloudflare WARP (unofficial)"
license = "MIT"

[[bin]]
name = "usque-rs"
path = "src/main.rs"

[dependencies]
quiche = "0.30.0"
octets = "0.3"
bytes = "1"

tokio = { version = "1", features = ["io-util", "net", "macros", "rt", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
base64 = "0.23"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
rcgen = "0.14"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }
tun-rs = { version = "2.8.8", features = ["async"] }
rtnetlink = "0.23"
futures = "0.3"
tempfile = "3"
time = "0.3"
socket2 = "0.6"
nix = { version = "0.31.3", features = ["net", "socket", "uio"] }
datagram-socket = "0.8.0"

[patch.crates-io]
quiche = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "f793695dcabd4ce4095ad2a7dd34e31d0eb34819" }
octets = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "f793695dcabd4ce4095ad2a7dd34e31d0eb34819" }
tun-rs = { git = "https://github.com/codeandsolder/tun-rs-fast.git", rev = "5da47016453dbed605705711a646d49a68ee9d72" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
