# Go is downloaded from upstream rather than apt - distro packages may be too
# old for BoringSSL's generate_build_files.go.

[build.env]
passthrough = [
    "CARGO_TERM_COLOR",
    "RUST_BACKTRACE",
    # The release workflow mounts the canonical client and injects the
    # container-local wrapper and CMake paths through Docker options.
    # Don't pass through host RUSTC_WRAPPER: cross first runs cargo metadata
    # on the host, where the wrapper must remain host-executable.
    "SCCACHE_CLIENT_SIDE",
    "SCCACHE_START_SERVER",
    "SCCACHE_NO_AUTO_START_SERVER",
]

[build]
pre-build = [
    "apt-get update -qq",
    "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build perl pkg-config clang libclang-dev nasm curl ca-certificates xz-utils",
    "curl -sSfL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz -o /tmp/go1.27.1.linux-amd64.tar.gz",
    "echo '63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  /tmp/go1.27.1.linux-amd64.tar.gz' | sha256sum -c -",
    "tar -xzf /tmp/go1.27.1.linux-amd64.tar.gz -C /usr/local",
    "rm /tmp/go1.27.1.linux-amd64.tar.gz",
    "ln -sf /usr/local/go/bin/go /usr/local/bin/go",
]

# mipsel: rust-std removed from stable; cross will build it from source via nightly.
[target.mipsel-unknown-linux-musl]
build-std = true

