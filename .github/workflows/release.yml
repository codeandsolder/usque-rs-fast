name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CROSS_CONFIG: Cross.toml

jobs:
  build:
    name: Build / ${{ matrix.artifact_name }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── x86_64 ──────────────────────────────────────────────────────
          - target: x86_64-unknown-linux-musl
            artifact_name: usque-rs-x86_64-linux-musl

          - target: x86_64-unknown-linux-musl
            artifact_name: usque-rs-x86_64-v2-linux-musl
            rustflags: "-C target-cpu=x86-64-v2"
            cpu_level: v2

          - target: x86_64-unknown-linux-musl
            artifact_name: usque-rs-x86_64-v3-linux-musl
            rustflags: "-C target-cpu=x86-64-v3"
            cpu_level: v3

          # AMD Zen / EPYC specialist builds. These are intentionally
          # optional; x86-64-v3 remains the portable performance tier.
          - target: x86_64-unknown-linux-musl
            artifact_name: usque-rs-x86_64-znver1-linux-musl
            rustflags: "-C target-cpu=znver1"
            cpu_level: znver1

          - target: x86_64-unknown-linux-musl
            artifact_name: usque-rs-x86_64-znver2-linux-musl
            rustflags: "-C target-cpu=znver2"
            cpu_level: znver2

          # ── 64-bit ARM ───────────────────────────────────────────────────
          - target: aarch64-unknown-linux-musl
            artifact_name: usque-rs-aarch64-linux-musl

          # ── 32-bit ARM ───────────────────────────────────────────────────
          - target: armv7-unknown-linux-musleabihf
            artifact_name: usque-rs-armv7-linux-musleabihf

          - target: arm-unknown-linux-musleabi
            artifact_name: usque-rs-arm-linux-musleabi

          - target: armv5te-unknown-linux-musleabi
            artifact_name: usque-rs-armv5te-linux-musleabi

          # ── MIPS (OpenWrt routers) ────────────────────────────────────────
          # mipsel = little-endian (MIPS24Kc etc.); big-endian mips and
          # mips64el are excluded: BoringSSL doesn't support those processors
          # (at least I couldn't get it working).
          # rust-std was removed from stable for MIPS; nightly + build-std used.
          - target: mipsel-unknown-linux-musl
            artifact_name: usque-rs-mipsel-linux-musl
            toolchain: nightly
            # build-std only compiles std, not panic_abort; keep unwind for this target
            panic_strategy: unwind

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain || '1.99.1' }}

      - name: Setup mandatory shared sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@be66a1ada16209be5b75d39724ef7383892d92cc # main
        with:
          rust-toolchain: "${{ matrix.toolchain || '1.99.1' }}"
          # Scope the persisted cache by target/CPU. The setup input only
          # affects the cache identity; it does not set compiler RUSTFLAGS.
          rustflags: "cross:${{ matrix.target }}:${{ matrix.cpu_level || 'baseline' }}:${{ matrix.rustflags || '' }}"

      - name: Install cross
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cross

      - name: Build (release)
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_PANIC: ${{ matrix.panic_strategy || 'abort' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: ${{ matrix.rustflags || '' }}
        run: bash .github/scripts/cross-build-with-sccache.sh "${{ matrix.target }}"

      - name: Strip binary
        run: |
          sudo apt-get install -y --no-install-recommends llvm 2>/dev/null || true
          if command -v llvm-strip &>/dev/null; then
            llvm-strip --strip-all target/${{ matrix.target }}/release/usque-rs
          else
            # Fallback: find the versioned llvm-strip (e.g. llvm-strip-18)
            STRIP=$(ls /usr/bin/llvm-strip-* 2>/dev/null | sort -V | tail -1)
            if [[ -n "$STRIP" ]]; then
              "$STRIP" --strip-all target/${{ matrix.target }}/release/usque-rs
            else
              echo "No llvm-strip found, skipping strip step."
            fi
          fi

      - name: Package archive
        id: pkg
        run: |
          ARCHIVE="${{ matrix.artifact_name }}-${{ github.ref_name }}.tar.gz"
          tar czf "$ARCHIVE" \
            -C target/${{ matrix.target }}/release \
            usque-rs
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ARCHIVE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Generate checksum
        run: |
          sha256sum "${{ steps.pkg.outputs.archive }}" \
            > "${{ steps.pkg.outputs.archive }}.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
          # All matrix jobs upload to the same release. Generate notes in one
          # job only or GitHub appends the same generated body once per target.
          generate_release_notes: ${{ matrix.artifact_name == 'usque-rs-x86_64-linux-musl' }}
          fail_on_unmatched_files: true
      - name: Finalize mandatory shared sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@be66a1ada16209be5b75d39724ef7383892d92cc # main
