name: Cargo release-age quarantine

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quarantine:
    uses: codeandsolder/ci-workflows/.github/workflows/cargo-release-quarantine.yml@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
    with:
      hours: 72
