name: Cargo release-age quarantine

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quarantine:
    uses: codeandsolder/ci-workflows/.github/workflows/cargo-release-quarantine.yml@0188eacbbff0836d0b5eca53b6cad4355adecd9e # main
    with:
      hours: 72
