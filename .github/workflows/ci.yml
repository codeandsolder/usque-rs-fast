name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
    inputs:
      validation:
        description: Validation path to exercise manually
        type: choice
        required: true
        default: routine
        options: [routine, cross-cache]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  current-linux:
    name: Current Rust 1.99.1 Linux validation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation != 'cross-cache' }}
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
    with:
      runner: ubuntu-26.04
      rust-toolchain: "1.99.1"
      rust-components: "rustfmt clippy"
      rustflags: "-C target-cpu=x86-64-v2"
      command: |
        set -euo pipefail
        # Preserve all existing source, format, Clippy, test and feature checks.
        if git grep -n -E '(^|[^[:alnum:]_])allow[[:space:]]*\(' -- '*.rs'; then
          echo 'allow(...) attributes are forbidden in Rust sources; use a narrow reasoned expect(...)' >&2
          exit 1
        fi
        python3 -m py_compile .github/scripts/*.py
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends cmake ninja-build golang-go perl pkg-config clang libclang-dev nasm
        cargo +1.99.1 fmt --all --check
        cargo +1.99.1 clippy --all-targets --all-features -- -D warnings
        cargo +1.99.1 test --all-features
        cargo +1.99.1 check --all-targets
        cargo +1.99.1 check --all-targets --no-default-features
        for features in register tun http-proxy https-proxy socks5-proxy http-proxy,https-proxy,socks5-proxy; do
          cargo +1.99.1 check --all-targets --no-default-features --features "$features"
        done

  cross-cache-smoke:
    # Explicit dispatch only: no additional routine PR runners, no release
    # artifacts. Uses the actual release bridge against one representative
    # cross container to verify client-side cache connectivity.
    name: Cross-container sccache smoke (x86_64 musl)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation == 'cross-cache' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      CROSS_CONFIG: Cross.toml
      CARGO_PROFILE_RELEASE_PANIC: abort
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
        with:
          rust-toolchain: "1.99.1"
          rustflags: "cross:x86_64-unknown-linux-musl:baseline"
      - name: Install cross
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cross
      - name: Build representative release target and check cache activity
        shell: bash
        run: |
          bash .github/scripts/cross-build-with-sccache.sh x86_64-unknown-linux-musl
          test -f target/x86_64-unknown-linux-musl/release/usque-rs
          "$SCCACHE_BIN" --show-stats --stats-format json | python3 -c '
          import json,sys
          stats=json.load(sys.stdin)["stats"]
          n=stats.get("compile_requests",0)
          print(f"Cross-container sccache compile requests: {n}")
          if n < 1: sys.exit("No compiler traffic reached the host sccache daemon")
          '
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@6b1adce9a7b2de91d50572fda04bed37c805f814 # main

  x86-codegen:
    name: x86 codegen / ${{ matrix.cpu }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        cpu: [x86-64-v2, x86-64-v3, znver1, znver2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build golang-go perl \
            pkg-config clang libclang-dev nasm

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
        with:
          rust-toolchain: "1.99.1"
          rustflags: "-C target-cpu=${{ matrix.cpu }}"

      - name: Check target CPU build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        run: cargo +1.99.1 check --all-targets --all-features --target x86_64-unknown-linux-gnu
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@6b1adce9a7b2de91d50572fda04bed37c805f814 # main
