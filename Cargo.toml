[package]
name = "usque-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Tiny Rust MASQUE (CONNECT-IP) client for Cloudflare WARP (unofficial)"
license = "MIT"

[[bin]]
name = "usque-rs"
path = "src/main.rs"

[dependencies]
quiche = "0.30.0"
octets = "0.3"
bytes = "1"

tokio = { version = "1", features = ["io-util", "net", "macros", "process", "rt", "signal", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
base64 = "0.23"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
rcgen = "0.14"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }
tun-rs = { version = "2.8.8", features = ["async"] }
rtnetlink = "0.23"
futures = "0.3"
tempfile = "3"
time = "0.3"
socket2 = "0.6"
nix = { version = "0.31.3", features = ["net", "socket", "uio"] }
datagram-socket = "0.8.0"
fast-socks5 = "1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "async", "medium-ip", "proto-ipv4", "proto-ipv4-fragmentation", "proto-ipv6", "proto-ipv6-fragmentation", "fragmentation-buffer-size-65536", "reassembly-buffer-size-65536", "socket-tcp", "socket-tcp-reno", "socket-udp", "socket-dns", "dns-max-result-count-8", "dns-max-server-count-4"] }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
similar_names = "allow"
fn_params_excessive_bools = "allow"
large_futures = "allow"
items_after_statements = "allow"
cargo_common_metadata = "allow"

[patch.crates-io]
quiche = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "f539155b38778b8e058710bc7f6f0e2e7dfb1df2" }
octets = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "f539155b38778b8e058710bc7f6f0e2e7dfb1df2" }
tun-rs = { git = "https://github.com/codeandsolder/tun-rs-fast.git", rev = "2fbed52d52028f1851e558d05f66ba7c6560c401" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
