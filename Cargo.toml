[package]
name = "usque-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tiny Rust MASQUE (CONNECT-IP) client for Cloudflare WARP (unofficial)"
license = "MIT"

[[bin]]
name = "usque-rs"
path = "src/main.rs"

[dependencies]
quiche = "0.30.0"
octets = "0.3"
bytes = "1"

tokio = { version = "1", features = ["io-util", "net", "macros", "rt", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
base64 = "0.23"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
rcgen = "0.14"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }
x509-cert = { version = "0.3", default-features = false, features = ["pem"] }
tun-rs = { version = "2.8.8", features = ["async"] }
rtnetlink = "0.23"
futures = "0.3"
tempfile = "3"
time = "0.3"
socket2 = "0.6"
nix = { version = "0.31.3", features = ["net", "socket", "time", "uio"] }
datagram-socket = "0.8.0"
fast-socks5 = "1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "async", "medium-ip", "proto-ipv4", "proto-ipv4-fragmentation", "proto-ipv6", "proto-ipv6-fragmentation", "fragmentation-buffer-size-65536", "reassembly-buffer-size-65536", "socket-tcp", "socket-tcp-reno", "socket-udp", "socket-dns", "dns-max-result-count-8", "dns-max-server-count-4"] }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
quick_cache = "0.7.0"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = "deny"
rust_2024_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[patch.crates-io]
quiche = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "f539155b38778b8e058710bc7f6f0e2e7dfb1df2" }
octets = { git = "https://github.com/codeandsolder/quiche-fast.git", rev = "f539155b38778b8e058710bc7f6f0e2e7dfb1df2" }
tun-rs = { git = "https://github.com/codeandsolder/tun-rs-fast.git", rev = "2fbed52d52028f1851e558d05f66ba7c6560c401" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
